name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/mvp-guarda-roupa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          # força o celular a baixar a versão nova (evita cache antigo)
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(src/[a-z-]+\.(js|css))\"#\1?v=$V\"#g" _site/index.html
          grep -o 'src/[^"]*' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
